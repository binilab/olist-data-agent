[project]
name = "olist-data-agent"
version = "0.1.0"
description = "자연어 질문을 검증된 SQL로 바꿔 Olist 이커머스 데이터를 분석하는 에이전트"
readme = "README.md"
authors = [
    { name = "binilab", email = "rladnjsqls94@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "kagglehub>=1.0.3",
    "pandas>=3.1.1",
    "psycopg[binary]>=3.3.9",
    "python-dotenv>=1.2.4",
    "sqlalchemy>=2.1.9",
]

[build-system]
requires = ["uv_build>=0.13.7,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "ipykernel>=7.4.0",
    "pytest>=9.2.0",
    "ruff>=0.17.6",
]
